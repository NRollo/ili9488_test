; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = espidf
board_build.partitions = ESP32_OTA_4M.csv
;board_build.embed_files =
;    src/certs/server_cert.pem
;    src/certs/server_key.pem
;    src/html/apple-touch-icon.png
;    src/html/home.html
;    src/html/set_time_page.html
;    src/html/test_page.html
;    src/html/log_page.html
;    src/html/syslog_page.html
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    direct
monitor_rts = 0
monitor_dtr = 0
debug_tool = olimex-arm-usb-ocd-h
debug_speed = 8000
build_flags = -DCORE_DEBUG_LEVEL=5
